
name: Selenium Kill Bill Automation

on:
  workflow_dispatch:
    inputs:
      framework:
        description: "Select test framework"
        required: true
        type: choice
        options:
          - testng
          - cucumber
        default: testng

      execution:
        description: "Select execution mode"
        required: true
        type: choice
        options:
          - serial
          - parallel
        default: serial

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  automation-tests:
    runs-on: windows-2022

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Verify Java and Maven
      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      # 4. Create environment file
      - name: Create environment file
        shell: pwsh
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          BASE_URL: ${{ vars.BASE_URL }}
          DB_URL: ${{ vars.DB_URL }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ vars.DB_PASSWORD }}
          LOGIN_USERNAME: ${{ vars.LOGIN_USERNAME }}
          LOGIN_PASSWORD: ${{ vars.LOGIN_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force `
            -Path "src/main/java/env" | Out-Null

          @"
          API_BASE_URL=$env:API_BASE_URL
          BASE_URL=$env:BASE_URL
          DB_URL=$env:DB_URL
          DB_USERNAME=$env:DB_USERNAME
          DB_PASSWORD=$env:DB_PASSWORD
          LOGIN_USERNAME=$env:LOGIN_USERNAME
          LOGIN_PASSWORD=$env:LOGIN_PASSWORD
          "@ | Set-Content `
            -Path "src/main/java/env/.env" `
            -Encoding utf8

          Write-Host "Environment file created successfully."

      # 5. Start Kill Bill Docker services
      - name: Start Kill Bill Docker services
        shell: pwsh
        run: |
          docker compose -f killbill-selenium/docker-compose.yml up -d

          if ($LASTEXITCODE -ne 0) {
            throw "Docker Compose startup failed."
          }

          docker compose -f killbill-selenium/docker-compose.yml ps

      # 6. Wait for services
      - name: Wait for Kill Bill services
        shell: pwsh
        run: |
          $ports = @(8080, 9090, 3307)

          foreach ($port in $ports) {
            $ready = $false

            for ($i = 1; $i -le 40; $i++) {
              $connection = Test-NetConnection `
                -ComputerName localhost `
                -Port $port `
                -WarningAction SilentlyContinue

              if ($connection.TcpTestSucceeded) {
                Write-Host "Port $port is available."
                $ready = $true
                break
              }

              Write-Host "Waiting for port $port..."
              Start-Sleep -Seconds 10
            }

            if (-not $ready) {
              throw "Service on port $port did not become available."
            }
          }

      # 7. Run selected test suite
      - name: Execute automation tests
        shell: pwsh
        run: |
          $framework = "${{ inputs.framework }}"
          $execution = "${{ inputs.execution }}"

          if ([string]::IsNullOrWhiteSpace($framework)) {
            $framework = "testng"
          }

          if ([string]::IsNullOrWhiteSpace($execution)) {
            $execution = "serial"
          }

          $suiteFile = "$framework-$execution.xml"

          Write-Host "Selected framework: $framework"
          Write-Host "Selected execution: $execution"
          Write-Host "Executing suite: $suiteFile"

          if (-not (Test-Path $suiteFile)) {
            throw "Suite file not found: $suiteFile"
          }

          mvn clean test "-Dsurefire.suiteXmlFiles=$suiteFile"

          if ($LASTEXITCODE -ne 0) {
            throw "Automation tests failed."
          }

      # 8. Upload TestNG reports
      - name: Upload TestNG reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-reports
          path: |
            test-output/
            target/surefire-reports/
          if-no-files-found: warn

      # 9. Upload Cucumber reports
      - name: Upload Cucumber reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports
          path: |
            target/cucumber-reports/
          if-no-files-found: warn

      # 10. Docker logs on failure
      - name: Collect Docker logs
        if: failure()
        shell: pwsh
        run: |
          docker compose -f killbill-selenium/docker-compose.yml logs

      # 11. Stop Docker services
      - name: Stop Kill Bill Docker services
        if: always()
        shell: pwsh
        run: |
          docker compose -f killbill-selenium/docker-compose.yml down
