
name: Windows Selenium CI

on:
  workflow_dispatch:
    inputs:
      framework:
        description: "Test framework"
        required: true
        type: choice
        options:
          - bdd
          - testng
        default: bdd

      execution:
        description: "Execution mode"
        required: true
        type: choice
        options:
          - serial
          - parallel
        default: serial

      browser:
        description: "Browser"
        required: true
        type: choice
        options:
          - chrome
          - edge
          - firefox
          - all
        default: chrome

      headless:
        description: "Run browser in headless mode"
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "true"

      class_name:
        description: "TestNG class name (without .java)"
        required: false
        type: string
        default: ""

      feature_file:
        description: "BDD feature file"
        required: false
        type: string
        default: "src/test/resources/features/Login_Test.feature"

      thread_count:
        description: "Parallel thread count"
        required: false
        type: string
        default: "4"

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  selenium-tests:
    name: Windows Selenium CI
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120

    defaults:
      run:
        shell: powershell

    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      BASE_URL: ${{ vars.BASE_URL }}
      DB_URL: ${{ vars.DB_URL }}
      DB_USERNAME: ${{ vars.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      LOGIN_USERNAME: ${{ vars.LOGIN_USERNAME }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. VERIFY JAVA AND MAVEN
      # --------------------------------------------------
      - name: Verify Windows CI environment
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "================================="
          Write-Host "WINDOWS SELENIUM CI ENVIRONMENT"
          Write-Host "================================="

          Write-Host "JAVA_HOME: $env:JAVA_HOME"

          $javaOutput = & $env:ComSpec /d /c "java -version 2>&1"

          if ($LASTEXITCODE -ne 0) {
              throw "Java is not available."
          }

          $javaVersion = $javaOutput -join "`n"
          Write-Host $javaVersion

          if ($javaVersion -notmatch 'version "(\d+)') {
              throw "Unable to identify Java version."
          }

          $javaMajor = [int]$Matches[1]

          if ($javaMajor -lt 17) {
              throw "Java 17 or newer is required. Found Java $javaMajor."
          }

          Write-Host "Java $javaMajor detected."

          if ($env:JAVA_HOME) {
              if (-not (Test-Path "$env:JAVA_HOME\bin\java.exe")) {
                  throw "JAVA_HOME does not contain java.exe."
              }
          }

          $mavenOutput = & $env:ComSpec /d /c "mvn -version 2>&1"

          if ($LASTEXITCODE -ne 0) {
              throw "Maven is not available on PATH."
          }

          $mavenOutput | ForEach-Object {
              Write-Host $_
          }

          if (-not (Test-Path "pom.xml")) {
              throw "pom.xml not found."
          }

          $mavenRepo = Join-Path $env:USERPROFILE ".m2\repository"

          if (Test-Path $mavenRepo) {
              Write-Host "Existing Maven repository: $mavenRepo"
          }
          else {
              Write-Host "Maven repository will be created."
          }

          Write-Host "Environment verification completed."

      # --------------------------------------------------
      # 3. VERIFY BROWSERS
      # --------------------------------------------------
      - name: Verify installed browsers
        run: |
          $ErrorActionPreference = "Stop"

          $browserPaths = @{
              chrome = @(
                  "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
                  "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
                  "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
              )

              edge = @(
                  "$env:ProgramFiles(x86)\Microsoft\Edge\Application\msedge.exe",
                  "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
              )

              firefox = @(
                  "$env:ProgramFiles\Mozilla Firefox\firefox.exe",
                  "${env:ProgramFiles(x86)}\Mozilla Firefox\firefox.exe"
              )
          }

          foreach ($browser in $browserPaths.Keys) {
              $found = $false

              foreach ($path in $browserPaths[$browser]) {
                  if ($path -and (Test-Path $path)) {
                      Write-Host "$browser installed: $path"
                      $found = $true
                      break
                  }
              }

              if (-not $found) {
                  Write-Host "$browser executable not found."
              }
          }

      # --------------------------------------------------
      # 4. CONFIGURE EXECUTION
      # --------------------------------------------------
      - name: Configure test execution
        run: |
          $ErrorActionPreference = "Stop"

          $framework = "${{ github.event_name == 'workflow_dispatch' && inputs.framework || 'bdd' }}".ToLower()
          $execution = "${{ github.event_name == 'workflow_dispatch' && inputs.execution || 'serial' }}".ToLower()
          $browser = "${{ github.event_name == 'workflow_dispatch' && inputs.browser || 'chrome' }}".ToLower()
          $headless = "${{ github.event_name == 'workflow_dispatch' && inputs.headless || 'true' }}".ToLower()

          $className = "${{ github.event_name == 'workflow_dispatch' && inputs.class_name || '' }}".Trim()

          $featureFile = "${{ github.event_name == 'workflow_dispatch' && inputs.feature_file || 'src/test/resources/features/Login_Test.feature' }}".Trim()

          $threadCount = "${{ github.event_name == 'workflow_dispatch' && inputs.thread_count || '4' }}".Trim()

          if ($framework -notin @("bdd", "testng")) {
              throw "Invalid framework."
          }

          if ($execution -notin @("serial", "parallel")) {
              throw "Invalid execution mode."
          }

          if ($browser -notin @("chrome", "edge", "firefox", "all")) {
              throw "Invalid browser."
          }

          if ($headless -notin @("true", "false")) {
              throw "Invalid headless setting."
          }

          if ($threadCount -notmatch '^[1-9][0-9]*$') {
              throw "Thread count must be a positive integer."
          }

          if ($execution -eq "serial") {
              $threadCount = "1"
          }

          if ($framework -eq "testng") {
              $featureFile = ""

              if ($className -and $className -notmatch '^[a-zA-Z_][a-zA-Z0-9_]*$') {
                  throw "Invalid TestNG class name."
              }
          }

          if ($framework -eq "bdd") {
              $className = ""

              if (-not $featureFile) {
                  throw "BDD feature file is required."
              }

              if (-not (Test-Path $featureFile)) {
                  throw "Feature file not found: $featureFile"
              }
          }

          $profile = "$framework-$execution"

          if ($browser -eq "all") {
              $browsers = @("chrome", "edge", "firefox")
          }
          else {
              $browsers = @($browser)
          }

          "FRAMEWORK=$framework" | Out-File $env:GITHUB_ENV -Append
          "EXECUTION=$execution" | Out-File $env:GITHUB_ENV -Append
          "PROFILE=$profile" | Out-File $env:GITHUB_ENV -Append
          "HEADLESS=$headless" | Out-File $env:GITHUB_ENV -Append
          "CLASS_NAME=$className" | Out-File $env:GITHUB_ENV -Append
          "FEATURE_FILE=$featureFile" | Out-File $env:GITHUB_ENV -Append
          "THREAD_COUNT=$threadCount" | Out-File $env:GITHUB_ENV -Append
          "BROWSERS=$($browsers -join ',')" | Out-File $env:GITHUB_ENV -Append

          Write-Host "================================="
          Write-Host "EXECUTION CONFIGURATION"
          Write-Host "================================="
          Write-Host "Framework: $framework"
          Write-Host "Execution: $execution"
          Write-Host "Profile: $profile"
          Write-Host "Browsers: $($browsers -join ', ')"
          Write-Host "Headless: $headless"
          Write-Host "Thread count: $threadCount"
          Write-Host "TestNG class: $className"
          Write-Host "Feature file: $featureFile"

      # --------------------------------------------------
      # 5. EXECUTE TESTS
      # --------------------------------------------------
      - name: Execute Selenium tests
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path "ci-artifacts" | Out-Null

          $browsers = $env:BROWSERS.Split(",")
          $failedBrowsers = @()

          foreach ($browser in $browsers) {

              $browser = $browser.Trim()

              Write-Host ""
              Write-Host "================================="
              Write-Host "RUNNING TESTS: $browser"
              Write-Host "================================="

              $browserArtifactDir = Join-Path "ci-artifacts" $browser

              New-Item -ItemType Directory -Force -Path $browserArtifactDir | Out-Null

              $stdoutLog = Join-Path $browserArtifactDir "maven-output.log"
              $executionLog = Join-Path $browserArtifactDir "execution.log"

              # Select the correct suite XML.
              $suiteSource = switch ($env:PROFILE) {
                  "testng-serial"   { "testng-serial.xml" }
                  "testng-parallel" { "testng-parallel.xml" }
                  "bdd-serial"      { "bdd-serial.xml" }
                  "bdd-parallel"    { "bdd-parallel.xml" }
                  default {
                      throw "Unknown Maven profile: $env:PROFILE"
                  }
              }

              if (-not (Test-Path $suiteSource)) {
                  throw "Suite XML not found: $suiteSource"
              }

              # Create temporary suite XML.
              $suiteDestinationDir = Join-Path $browserArtifactDir "config"

              New-Item -ItemType Directory -Force -Path $suiteDestinationDir | Out-Null

              $suiteDestination = Join-Path $suiteDestinationDir $suiteSource

              # Load the TestNG suite XML
              
              [xml]$suiteXml = Get-Content -Path $suiteFile -Raw
              
              # Get the root XML element directly
              $suiteElement = $suiteXml.DocumentElement
              
              if ($null -eq $suiteElement) {
                  throw "Unable to load TestNG suite XML: $suiteFile"
              }
              
              # Configure parallel execution
              if ($framework -eq "bdd" -and $execution -eq "parallel") {
              
                  $suiteElement.SetAttribute(
                      "data-provider-thread-count",
                      "$threadCount"
                  )
              
                  Write-Host "BDD parallel execution enabled. Data provider threads: $threadCount"
              }
              elseif ($framework -eq "testng" -and $execution -eq "parallel") {
              
                  $suiteElement.SetAttribute(
                      "thread-count",
                      "$threadCount"
                  )
              
                  Write-Host "TestNG parallel execution enabled. Threads: $threadCount"
              }
              
              # Save the updated XML
              $suiteXml.Save($suiteFile)


              # Build Maven arguments.
              $mavenArgs = @(
                  "-B"
                  "-ntp"
                  "-e"
                  "clean"
                  "test"
                  "-P$env:PROFILE"
                  "-Dsuite=$suiteDestination"
                  "-DBROWSER=$browser"
                  "-DHEADLESS=$env:HEADLESS"
                  "-DINCOGNITO=false"
                  "-DREUSE_BROWSER=true"
                  "-Dthread.count=$env:THREAD_COUNT"
                  "-Ddataprovider.thread.count=$env:THREAD_COUNT"
              )

              if ($env:FRAMEWORK -eq "testng" -and $env:CLASS_NAME) {
                  $mavenArgs += "-Dtest=$env:CLASS_NAME"
              }

              if ($env:FRAMEWORK -eq "bdd" -and $env:FEATURE_FILE) {
                  $mavenArgs += "-Dcucumber.features=$env:FEATURE_FILE"
              }

              Write-Host "Browser: $browser"
              Write-Host "Framework: $env:FRAMEWORK"
              Write-Host "Execution: $env:EXECUTION"
              Write-Host "Thread count: $env:THREAD_COUNT"

              Write-Host "`nMaven arguments:"
              $mavenArgs | ForEach-Object {
                  Write-Host $_
              }

              Add-Content $executionLog "Browser: $browser"
              Add-Content $executionLog "Profile: $env:PROFILE"
              Add-Content $executionLog "Framework: $env:FRAMEWORK"
              Add-Content $executionLog "Execution: $env:EXECUTION"
              Add-Content $executionLog "Threads: $env:THREAD_COUNT"
              Add-Content $executionLog "Suite XML: $suiteDestination"
              Add-Content $executionLog "Started: $(Get-Date)"

              # ------------------------------------------
              # Execute Maven.
              #
              # Windows PowerShell 5.1 can interpret native
              # stderr output as a PowerShell error.
              # Temporarily use Continue so Maven warnings
              # do not terminate this workflow step.
              # ------------------------------------------

              $previousErrorActionPreference = $ErrorActionPreference

              try {
                  $ErrorActionPreference = "Continue"

                  & mvn.cmd @mavenArgs *> $stdoutLog

                  $mavenExitCode = $LASTEXITCODE
              }
              catch {
                  Add-Content $executionLog "PowerShell execution error: $_"

                  Write-Host "Maven invocation encountered an error:"
                  Write-Host $_

                  $mavenExitCode = 1
              }
              finally {
                  $ErrorActionPreference = $previousErrorActionPreference
              }

              Add-Content $executionLog "Finished: $(Get-Date)"
              Add-Content $executionLog "Exit code: $mavenExitCode"

              Write-Host "`nMaven output (last 150 lines):"

              if (Test-Path $stdoutLog) {
                  Get-Content $stdoutLog -Tail 150
              }

              # Preserve TestNG reports.
              if (Test-Path "test-output") {
                  Copy-Item "test-output" `
                    (Join-Path $browserArtifactDir "test-output") `
                    -Recurse -Force
              }

              # Preserve Cucumber reports.
              if (Test-Path "target\cucumber-reports") {
                  Copy-Item "target\cucumber-reports" `
                    (Join-Path $browserArtifactDir "cucumber-reports") `
                    -Recurse -Force
              }

              # Preserve Surefire reports.
              if (Test-Path "target\surefire-reports") {
                  Copy-Item "target\surefire-reports" `
                    (Join-Path $browserArtifactDir "surefire-reports") `
                    -Recurse -Force
              }

              # Browser execution result.
              if ($mavenExitCode -ne 0) {
                  Write-Host "FAILED: $browser"
                  $failedBrowsers += $browser
              }
              else {
                  Write-Host "PASSED: $browser"
              }
          }

          # Fail the workflow if any browser failed.
          if ($failedBrowsers.Count -gt 0) {
              throw "Test execution failed for: $($failedBrowsers -join ', '). Check ci-artifacts for complete stack traces."
          }

          Write-Host "All browser executions completed successfully."

      # --------------------------------------------------
      # 6. UPLOAD ARTIFACTS
      # --------------------------------------------------
      - name: Upload test reports and execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-ci-reports-${{ github.run_number }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 7

      # --------------------------------------------------
      # 7. EXECUTION SUMMARY
      # --------------------------------------------------
      - name: Publish execution summary
        if: always()
        run: |
          @"
          ## Windows Selenium CI Execution

          | Setting | Value |
          |---|---|
          | Framework | $env:FRAMEWORK |
          | Execution | $env:EXECUTION |
          | Maven Profile | $env:PROFILE |
          | Browsers | $env:BROWSERS |
          | Headless | $env:HEADLESS |
          | Thread Count | $env:THREAD_COUNT |
          | TestNG Class | $env:CLASS_NAME |
          | BDD Feature | $env:FEATURE_FILE |

          Download the workflow artifact to inspect Maven logs and reports.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
