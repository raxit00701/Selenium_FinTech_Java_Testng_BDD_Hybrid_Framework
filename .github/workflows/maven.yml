name: Kill Bill Selenium CI (TestNG & BDD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      suite_type:
        description: 'Execution Suite Flow (TestNG / BDD - Serial / Parallel)'
        required: true
        type: choice
        default: 'testng-serial'
        options:
          - testng-serial
          - testng-parallel
          - bdd-serial
          - bdd-parallel
      test_class:
        description: 'Optional: Specific TestNG/BDD Class Name (e.g., Login_validation, Create_Subs, TestRunner, ParallelTestRunner). Leave empty to run full suite XML.'
        required: false
        type: string
        default: ''
      browser:
        description: 'Browser Selection (DriverFactory: chrome, edge, firefox, or all)'
        required: true
        type: choice
        default: 'chrome'
        options:
          - chrome
          - edge
          - firefox
          - all
      headless:
        description: 'Headless Mode (true = CI Headless, false = Virtual Display Xvfb)'
        required: true
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'
      incognito:
        description: 'Incognito / Private Mode'
        required: false
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
      thread_count:
        description: 'Parallel Thread Count (used when running parallel suites)'
        required: false
        type: string
        default: '4'

jobs:
  selenium-ci-execution:
    name: ${{ github.event.inputs.suite_type || 'testng-serial' }} | ${{ matrix.browser }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event.inputs.browser == 'all' && '["chrome", "edge", "firefox"]' || format('["{0}"]', github.event.inputs.browser || 'chrome')) }}

    env:
      BASE_URL: ${{ secrets.BASE_URL || vars.BASE_URL || 'http://localhost:9090' }}
      API_BASE_URL: ${{ secrets.API_BASE_URL || vars.API_BASE_URL || 'http://localhost:8080' }}
      LOGIN_USERNAME: ${{ secrets.LOGIN_USERNAME || vars.LOGIN_USERNAME || 'admin' }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD || vars.LOGIN_PASSWORD || 'password' }}
      DB_URL: ${{ secrets.DB_URL || vars.DB_URL || 'jdbc:mariadb://localhost:3307/killbill' }}
      DB_USERNAME: ${{ secrets.DB_USERNAME || vars.DB_USERNAME || 'root' }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD || vars.DB_PASSWORD || 'killbill' }}

      INPUT_SUITE_TYPE: ${{ github.event.inputs.suite_type || 'testng-serial' }}
      INPUT_TEST_CLASS: ${{ github.event.inputs.test_class || '' }}
      INPUT_BROWSER: ${{ matrix.browser }}
      INPUT_HEADLESS: ${{ github.event.inputs.headless || 'true' }}
      INPUT_INCOGNITO: ${{ github.event.inputs.incognito || 'false' }}
      INPUT_THREAD_COUNT: ${{ github.event.inputs.thread_count || '4' }}

    steps:
      # =========================================================
      # 1. CHECKOUT REPOSITORY
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. SETUP JAVA 17 & MAVEN CACHE
      # =========================================================
      - name: Set up JDK 17 with Maven Cache
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # =========================================================
      # 3. CACHE SELENIUM MANAGER & WEBDRIVER BINARIES
      # =========================================================
      - name: Cache Selenium Drivers
        uses: actions/cache@v4
        with:
          path: ~/.cache/selenium
          key: ${{ runner.os }}-selenium-drivers-${{ matrix.browser }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-selenium-drivers-${{ matrix.browser }}-
            ${{ runner.os }}-selenium-drivers-

      # =========================================================
      # 4. VERIFY BROWSERS ON UBUNTU RUNNER
      # =========================================================
      - name: Setup & Verify Browser (${{ matrix.browser }})
        run: |
          echo "::group::Browser Verification ($INPUT_BROWSER)"
          case "${INPUT_BROWSER,,}" in
            chrome)
              google-chrome --version
              ;;
            edge)
              microsoft-edge --version
              ;;
            firefox)
              if ! command -v firefox &> /dev/null; then
                sudo apt-get update && sudo apt-get install -y firefox
              fi
              firefox --version
              ;;
          esac
          echo "::endgroup::"

      # =========================================================
      # 5. CONFIGURE RUNTIME .env FROM CI VARIABLES / SECRETS
      # =========================================================
      - name: Configure Runtime Environment (.env)
        run: |
          echo "::group::Generating src/main/java/env/.env"
          mkdir -p src/main/java/env
          cat <<EOF > src/main/java/env/.env
          BASE_URL=${BASE_URL%/}
          API_BASE_URL=${API_BASE_URL%/}
          LOGIN_USERNAME=${LOGIN_USERNAME}
          LOGIN_PASSWORD=${LOGIN_PASSWORD}
          DB_URL=${DB_URL}
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}
          EOF
          echo "Runtime .env created (BASE_URL: ${BASE_URL%/} | API_BASE_URL: ${API_BASE_URL%/} | DB_URL: ${DB_URL})"
          echo "::endgroup::"

      # =========================================================
      # 6. START MARIADB, SEED BASELINE DATA, AND BOOT KILL BILL + KAUI
      # =========================================================
      # =========================================================
      # 6. START MARIADB, SEED BASELINE DATA, AND BOOT KILL BILL + KAUI
      # =========================================================
      - name: Start Kill Bill, Kaui & MariaDB Services
        run: |
          echo "::group::Starting MariaDB Container"
          if [ ! -f "ci-seed.sql" ]; then
            echo "ERROR: ci-seed.sql is missing from repository root. Export and commit ci-seed.sql first."
            exit 1
          fi

          docker compose -f docker-compose.yml up -d db
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.yml exec -T db mysqladmin ping -h localhost -u"${DB_USERNAME}" -p"${DB_PASSWORD}" --silent; then
              echo "MariaDB is ready on localhost:3307!"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Timed out waiting for MariaDB."
              exit 1
            fi
            sleep 2
          done

          echo "Importing baseline tenant & account data from ci-seed.sql..."
          sed -i '1s/^\xEF\xBB\xBF//' ci-seed.sql
          docker compose -f docker-compose.yml exec -T db mysql -u"${DB_USERNAME}" -p"${DB_PASSWORD}" < ci-seed.sql
          docker compose -f docker-compose.yml exec -T db mysql -u"${DB_USERNAME}" -p"${DB_PASSWORD}" -e "SELECT id, name FROM kaui.kaui_tenants; SELECT id, external_key FROM killbill.accounts WHERE id='d1b18d93-13c3-4315-b5e5-2e98f59e9fbb';"
          echo "::endgroup::"

          echo "::group::Starting Kill Bill (8080) & Kaui (9090)"
          docker compose -f docker-compose.yml up -d killbill kaui
          for i in $(seq 1 60); do
            kb_status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/1.0/healthcheck || echo "000")
            kaui_status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9090 || echo "000")
            echo "Attempt $i/60 -> Kill Bill HTTP: $kb_status | Kaui HTTP: $kaui_status"
            if [[ "$kb_status" == "200" && ("$kaui_status" == "200" || "$kaui_status" == "302") ]]; then
              echo "Kill Bill and Kaui are ready!"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timed out waiting for Kill Bill / Kaui containers."
              docker compose -f docker-compose.yml logs --tail=100
              exit 1
            fi
            sleep 3
          done
          echo "::endgroup::"

      # =========================================================
      # 7. COMPILE TEST CLASSES
      # =========================================================
      - name: Compile Project & Tests
        run: |
          echo "::group::Maven Test Compilation"
          mvn test-compile -B -Dstyle.color=always
          echo "::endgroup::"

      # =========================================================
      # 8. EXECUTE SELENIUM SUITE (TESTNG OR BDD / SERIAL OR PARALLEL)
      # =========================================================
      - name: Run Selenium Automation Suite
        id: run_tests
        run: |
          suite_type="${INPUT_SUITE_TYPE,,}"
          raw_class="$(echo "$INPUT_TEST_CLASS" | xargs)"
          browser="${INPUT_BROWSER,,}"
          headless="${INPUT_HEADLESS,,}"
          incognito="${INPUT_INCOGNITO,,}"

          case "$suite_type" in
            testng-serial)
              suite_xml="testng-serial.xml"
              exec_mode="none"
              threads="1"
              ;;
            testng-parallel)
              suite_xml="testng-parallel.xml"
              exec_mode="classes"
              threads="$INPUT_THREAD_COUNT"
              ;;
            bdd-serial)
              suite_xml="bdd-serial.xml"
              exec_mode="none"
              threads="1"
              ;;
            bdd-parallel)
              suite_xml="bdd-parallel.xml"
              exec_mode="none"
              threads="1"
              ;;
            *)
              echo "Unsupported suite_type: $suite_type"
              exit 1
              ;;
          esac

          mvn_args=(
            "test"
            "-B"
            "-e"
            "-Dstyle.color=always"
            "-P${suite_type}"
            "-Dexecution.mode=${exec_mode}"
            "-Dthread.count=${threads}"
            "-DBROWSER=${browser}"
            "-DHEADLESS=${headless}"
            "-DINCOGNITO=${incognito}"
          )

          if [ -n "$raw_class" ]; then
            normalized_class="${raw_class//\\//}"
            normalized_class="${normalized_class#src/test/java/}"
            normalized_class="${normalized_class%.java}"
            normalized_class="${normalized_class//\//.}"
            mvn_args+=("-Dtest=${normalized_class}")
            target_display="Single Class: ${normalized_class} (Flow: ${suite_type})"
          else
            mvn_args+=("-Dsuite=${suite_xml}")
            target_display="Suite XML: ${suite_xml} (Profile: ${suite_type})"
          fi

          echo "============================================================"
          echo " Execution Target : $target_display"
          echo " Browser          : $browser (Headless: $headless | Incognito: $incognito)"
          echo " Threading        : mode=$exec_mode | threads=$threads (DataProvider: pom.xml default)"
          echo " Command          : mvn ${mvn_args[*]}"
          echo "============================================================"

          {
            echo "### Kill Bill Selenium CI Run ($browser)"
            echo "| Parameter | Value |"
            echo "| :--- | :--- |"
            echo "| **Target** | \`$target_display\` |"
            echo "| **Browser** | \`$browser\` (Headless: \`$headless\`, Incognito: \`$incognito\`) |"
            echo "| **Parallel Mode** | \`$exec_mode\` (Threads: \`$threads\`, DataProvider: \`pom.xml default\`) |"
          } >> "$GITHUB_STEP_SUMMARY"

          set +e
          if [ "$headless" = "false" ]; then
            xvfb-run -a mvn "${mvn_args[@]}"
          else
            mvn "${mvn_args[@]}"
          fi
          exit_code=$?
          set -e

          if [ $exit_code -ne 0 ]; then
            for dump in target/surefire-reports/*.dumpstream; do
              [ -f "$dump" ] || continue
              echo "::group::Surefire Dump ($dump)"
              cat "$dump"
              echo "::endgroup::"
            done
            exit $exit_code
          fi

      # =========================================================
      # 9. DUMP DOCKER LOGS ON FAILURE
      # =========================================================
      - name: Print Container Logs on Failure
        if: failure()
        run: |
          echo "::group::Docker Compose Container Logs"
          docker compose -f docker-compose.yml logs --tail=150
          echo "::endgroup::"

      # =========================================================
      # 10. UPLOAD TESTNG ARTIFACT (ExecutionDashboard.html & Evidence)
      # =========================================================
      - name: Upload TestNG Dashboard & Execution Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-dashboard-${{ github.event.inputs.suite_type || 'testng-serial' }}-${{ matrix.browser }}
          path: |
            test-output/dashboard/ExecutionDashboard.html
            test-output/
          if-no-files-found: warn
          retention-days: 14

      # =========================================================
      # 11. UPLOAD BDD ARTIFACT (cucumber.html & cucumber.json)
      # =========================================================
      - name: Upload Cucumber BDD Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-cucumber-report-${{ github.event.inputs.suite_type || 'testng-serial' }}-${{ matrix.browser }}
          path: |
            target/cucumber-reports/cucumber.html
            target/cucumber-reports/cucumber.json
          if-no-files-found: warn
          retention-days: 14

      # =========================================================
      # 12. UPLOAD SUREFIRE LOGS & REPORTS
      # =========================================================
      - name: Upload Maven Surefire Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-logs-${{ github.event.inputs.suite_type || 'testng-serial' }}-${{ matrix.browser }}
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      # =========================================================
      # 13. TEARDOWN DOCKER & CLEANUP SENSITIVE .env FILE
      # =========================================================
      - name: Cleanup Docker & Runtime .env
        if: always()
        run: |
          docker compose -f docker-compose.yml down -v || true
          rm -f src/main/java/env/.env
