
name: Selenium Java CI - Windows 11

on:
  workflow_dispatch:
    inputs:
      framework:
        description: "Select automation framework"
        required: true
        type: choice
        default: bdd
        options:
          - bdd
          - testng

      execution_mode:
        description: "Select execution mode"
        required: true
        type: choice
        default: serial
        options:
          - serial
          - parallel

      browser:
        description: "Select browser"
        required: true
        type: choice
        default: chrome
        options:
          - chrome
          - edge
          - firefox
          - all

      headless:
        description: "Enable headless execution"
        required: true
        type: boolean
        default: true

      test_target:
        description: "BDD feature path or TestNG class name. Clear to run the complete suite."
        required: false
        default: "src/test/resources/features/Login_Test.feature"

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: selenium-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  selenium-tests:
    name: Selenium Automation
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120

    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      BASE_URL: ${{ vars.BASE_URL }}
      DB_URL: ${{ vars.DB_URL }}
      DB_USERNAME: ${{ vars.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      LOGIN_USERNAME: ${{ vars.LOGIN_USERNAME }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}

    steps:

      # ----------------------------------------
      # 1. CHECKOUT
      # ----------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # 2. JAVA SETUP
      # ----------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # ----------------------------------------
      # 3. VERIFY ENVIRONMENT
      # ----------------------------------------

      - name: Verify Windows Java and Maven
        shell: powershell
        run: |
          Write-Host "================================="
          Write-Host "WINDOWS SELENIUM CI ENVIRONMENT"
          Write-Host "================================="

          Write-Host "Java:"
          java -version

          if ($LASTEXITCODE -ne 0) {
            throw "Java installation is not working."
          }

          Write-Host "Maven:"
          mvn -version

          if ($LASTEXITCODE -ne 0) {
            throw "Maven is not installed or not available in PATH."
          }

          Write-Host "Project:"
          Get-Location

          if (-not (Test-Path "pom.xml")) {
            throw "pom.xml was not found."
          }

          Write-Host "pom.xml verified."

      # ----------------------------------------
      # 4. SELECT TEST CONFIGURATION
      # ----------------------------------------

      - name: Configure Test Execution
        id: config
        shell: powershell
        run: |
          $framework = "bdd"
          $execution = "serial"
          $browser = "chrome"
          $headless = "true"
          $target = "src/test/resources/features/Login_Test.feature"

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {

            $framework = "${{ inputs.framework }}"
            $execution = "${{ inputs.execution_mode }}"
            $browser = "${{ inputs.browser }}"
            $target = "${{ inputs.test_target }}"

            if ("${{ inputs.headless }}" -eq "false") {
              $headless = "false"
            }
          }

          if ($framework -notin @("bdd", "testng")) {
            throw "Invalid framework selected."
          }

          if ($execution -notin @("serial", "parallel")) {
            throw "Invalid execution mode selected."
          }

          if ($browser -notin @("chrome", "edge", "firefox", "all")) {
            throw "Invalid browser selected."
          }

          # BDD uses a feature file by default.
          # Clear the field to execute all features.
          # For TestNG, enter a class name.
          if ($framework -eq "testng" -and
              $target -eq "src/test/resources/features/Login_Test.feature") {
            $target = ""
          }

          $profile = "$framework-$execution"

          "FRAMEWORK=$framework" >> $env:GITHUB_ENV
          "EXECUTION_MODE=$execution" >> $env:GITHUB_ENV
          "SELECTED_BROWSER=$browser" >> $env:GITHUB_ENV
          "HEADLESS=$headless" >> $env:GITHUB_ENV
          "MAVEN_PROFILE=$profile" >> $env:GITHUB_ENV
          "TEST_TARGET=$target" >> $env:GITHUB_ENV

          Write-Host "Framework       : $framework"
          Write-Host "Execution       : $execution"
          Write-Host "Browser         : $browser"
          Write-Host "Headless        : $headless"
          Write-Host "Maven Profile   : $profile"
          Write-Host "Test Target     : $target"

      # ----------------------------------------
      # 5. INSTALL / VERIFY BROWSERS
      # ----------------------------------------

      - name: Install and Verify Browsers
        shell: powershell
        run: |
          $selected = $env:SELECTED_BROWSER

          if ($selected -eq "all") {
            $browsers = @("chrome", "edge", "firefox")
          }
          else {
            $browsers = @($selected)
          }

          function Get-BrowserExecutable($browser) {

            $paths = switch ($browser) {

              "chrome" {
                @(
                  "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
                  "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
                  "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
                )
              }

              "edge" {
                @(
                  "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
                  "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
                )
              }

              "firefox" {
                @(
                  "$env:ProgramFiles\Mozilla Firefox\firefox.exe",
                  "${env:ProgramFiles(x86)}\Mozilla Firefox\firefox.exe"
                )
              }
            }

            foreach ($path in $paths) {
              if (Test-Path $path) {
                return $path
              }
            }

            return $null
          }

          foreach ($browser in $browsers) {

            $executable = Get-BrowserExecutable $browser

            if (-not $executable) {

              Write-Host "$browser is missing. Attempting installation."

              if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
                throw "winget is unavailable. Install $browser manually on the runner."
              }

              $package = switch ($browser) {
                "chrome"  { "Google.Chrome" }
                "edge"    { "Microsoft.Edge" }
                "firefox" { "Mozilla.Firefox" }
              }

              winget install --id $package --exact --silent `
                --accept-package-agreements `
                --accept-source-agreements

              if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
                throw "Installation failed for $browser."
              }

              $executable = Get-BrowserExecutable $browser
            }

            if (-not $executable) {
              throw "$browser executable could not be located after installation."
            }

            Write-Host "$browser verified: $executable"
          }

      # ----------------------------------------
      # 6. RESOLVE POM DEPENDENCIES
      # ----------------------------------------

      - name: Resolve Maven Dependencies
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "ci-artifacts/setup" | Out-Null

          mvn -B -ntp dependency:resolve 2>&1 |
            Tee-Object -FilePath "ci-artifacts/setup/dependency-resolution.log"

          $result = $LASTEXITCODE

          if ($result -ne 0) {
            throw "Maven dependency resolution failed."
          }

          Write-Host "Maven dependencies resolved successfully."

      # ----------------------------------------
      # 7. EXECUTE SELENIUM TESTS
      # ----------------------------------------

      - name: Run Selenium Automation
        shell: powershell
        run: |
          $framework = $env:FRAMEWORK
          $profile = $env:MAVEN_PROFILE
          $target = $env:TEST_TARGET
          $headless = $env:HEADLESS

          if ($env:SELECTED_BROWSER -eq "all") {
            $browsers = @("chrome", "edge", "firefox")
          }
          else {
            $browsers = @($env:SELECTED_BROWSER)
          }

          $failedBrowsers = @()

          New-Item -ItemType Directory -Force -Path "ci-artifacts" | Out-Null

          foreach ($browser in $browsers) {

            Write-Host ""
            Write-Host "========================================"
            Write-Host "STARTING $browser AUTOMATION"
            Write-Host "========================================"

            $mavenArgs = @(
              "-B",
              "-ntp",
              "clean",
              "test",
              "-P$profile",
              "-DBROWSER=$browser",
              "-DHEADLESS=$headless",
              "-DINCOGNITO=false",
              "-DREUSE_BROWSER=true"
            )

            if (-not [string]::IsNullOrWhiteSpace($target)) {

              if ($framework -eq "testng") {

                $className = $target.Trim()

                if ($className -notmatch '^[A-Za-z0-9_.$*]+$') {
                  throw "Invalid TestNG class name: $className"
                }

                Write-Host "TestNG class: $className"

                $mavenArgs += "-Dtest=$className"
              }

              elseif ($framework -eq "bdd") {

                $feature = $target.Trim()

                if (-not (Test-Path -LiteralPath $feature -PathType Leaf)) {
                  throw "Feature file does not exist: $feature"
                }

                if ($feature -notmatch '\.feature$') {
                  throw "BDD target must be a .feature file."
                }

                Write-Host "BDD feature: $feature"

                $mavenArgs += "-Dcucumber.features=$feature"
              }
            }
            else {
              Write-Host "Executing complete suite."
            }

            Write-Host "Maven profile: $profile"
            Write-Host "Browser: $browser"
            Write-Host "Headless: $headless"

            Write-Host "Command:"
            Write-Host "mvn $($mavenArgs -join ' ')"

            $logFile = "ci-artifacts/$browser-maven.log"

            & mvn @mavenArgs 2>&1 |
              Tee-Object -FilePath $logFile

            $testExitCode = $LASTEXITCODE

            # Save reports separately for every browser.
            $browserArtifact = "ci-artifacts/$browser"

            New-Item -ItemType Directory -Force `
              -Path $browserArtifact | Out-Null

            if (Test-Path "test-output") {
              Copy-Item "test-output" `
                "$browserArtifact/test-output" -Recurse -Force
            }

            if (Test-Path "target/cucumber-reports") {
              New-Item -ItemType Directory -Force `
                -Path "$browserArtifact/target" | Out-Null

              Copy-Item "target/cucumber-reports" `
                "$browserArtifact/target/cucumber-reports" `
                -Recurse -Force
            }

            if (Test-Path "target/surefire-reports") {
              New-Item -ItemType Directory -Force `
                -Path "$browserArtifact/target" | Out-Null

              Copy-Item "target/surefire-reports" `
                "$browserArtifact/target/surefire-reports" `
                -Recurse -Force
            }

            if ($testExitCode -ne 0) {
              Write-Host "$browser execution FAILED."
              $failedBrowsers += $browser
            }
            else {
              Write-Host "$browser execution PASSED."
            }
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "SELENIUM EXECUTION COMPLETED"
          Write-Host "========================================"

          if ($failedBrowsers.Count -gt 0) {
            Write-Host "Failed browsers: $($failedBrowsers -join ', ')"
            exit 1
          }

          Write-Host "All selected browser executions passed."

      # ----------------------------------------
      # 8. TESTNG DASHBOARD ARTIFACT
      # ----------------------------------------

      - name: Upload TestNG Execution Dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestNG-Execution-Dashboard
          path: ci-artifacts/**/test-output/dashboard/ExecutionDashboard.html
          if-no-files-found: warn
          retention-days: 14

      # ----------------------------------------
      # 9. CUCUMBER HTML REPORT
      # ----------------------------------------

      - name: Upload Cucumber HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cucumber-BDD-HTML-Report
          path: ci-artifacts/**/target/cucumber-reports/cucumber.html
          if-no-files-found: warn
          retention-days: 14

      # ----------------------------------------
      # 10. COMPLETE AUTOMATION REPORTS
      # ----------------------------------------

      - name: Upload Complete Automation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Automation-Reports
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

      # ----------------------------------------
      # 11. EXECUTION SUMMARY
      # ----------------------------------------

      - name: Automation Execution Summary
        if: always()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "SELENIUM CI EXECUTION SUMMARY"
          Write-Host "======================================"

          Write-Host "Framework      : $env:FRAMEWORK"
          Write-Host "Execution Mode : $env:EXECUTION_MODE"
          Write-Host "Browser        : $env:SELECTED_BROWSER"
          Write-Host "Headless       : $env:HEADLESS"
          Write-Host "Maven Profile  : $env:MAVEN_PROFILE"
          Write-Host "Test Target    : $env:TEST_TARGET"

          Write-Host "======================================"
