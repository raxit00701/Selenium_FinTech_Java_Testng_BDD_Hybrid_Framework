
name: Selenium Java CI - Windows 11

on:
  workflow_dispatch:
    inputs:
      framework:
        description: "Select automation framework"
        required: true
        type: choice
        default: bdd
        options:
          - bdd
          - testng

      execution_mode:
        description: "Select execution mode"
        required: true
        type: choice
        default: serial
        options:
          - serial
          - parallel

      browser:
        description: "Select browser"
        required: true
        type: choice
        default: chrome
        options:
          - chrome
          - edge
          - firefox
          - all

      headless:
        description: "Enable headless execution"
        required: true
        type: boolean
        default: true

      test_target:
        description: "BDD feature path or TestNG class name. Clear to run complete suite."
        required: false
        default: "src/test/resources/features/Login_Test.feature"

      thread_count:
        description: "Parallel execution thread count"
        required: true
        type: number
        default: 4

      dataprovider_thread_count:
        description: "Parallel DataProvider thread count"
        required: true
        type: number
        default: 3

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: selenium-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  selenium-tests:
    name: Selenium Automation
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120

    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      BASE_URL: ${{ vars.BASE_URL }}
      DB_URL: ${{ vars.DB_URL }}
      DB_USERNAME: ${{ vars.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      LOGIN_USERNAME: ${{ vars.LOGIN_USERNAME }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}

    steps:

      # ========================================
      # 1. CHECKOUT
      # ========================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ========================================
      # 2. VERIFY EXISTING JAVA AND MAVEN
      # No Java installation.
      # No Maven cache upload.
      # ========================================

      - name: Verify Windows Java and Maven
        shell: powershell
        run: |
          Write-Host "================================="
          Write-Host "WINDOWS SELENIUM CI ENVIRONMENT"
          Write-Host "================================="

          Write-Host "JAVA_HOME: $env:JAVA_HOME"

          java -version

          if ($LASTEXITCODE -ne 0) {
            throw "Java installation is not working."
          }

          $javaVersion = (& java -version 2>&1 | Out-String)

          if ($javaVersion -notmatch 'version "17') {
            throw "Java 17 is required. Check JAVA_HOME and PATH."
          }

          mvn -version

          if ($LASTEXITCODE -ne 0) {
            throw "Maven is not installed or unavailable."
          }

          if (-not (Test-Path "pom.xml")) {
            throw "pom.xml was not found."
          }

          $m2 = "$env:USERPROFILE\.m2\repository"

          if (Test-Path $m2) {
            Write-Host "Existing Maven repository found: $m2"
          }
          else {
            Write-Host "Maven repository does not exist yet. Missing dependencies may need downloading."
          }

          Write-Host "Java and Maven verification completed."

      # ========================================
      # 3. CONFIGURE EXECUTION
      # ========================================

      - name: Configure Test Execution
        id: config
        shell: powershell
        run: |
          $framework = "bdd"
          $execution = "serial"
          $browser = "chrome"
          $headless = "true"
          $target = "src/test/resources/features/Login_Test.feature"

          $threadCount = 4
          $dataProviderThreadCount = 3

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {

            $framework = "${{ inputs.framework }}"
            $execution = "${{ inputs.execution_mode }}"
            $browser = "${{ inputs.browser }}"
            $target = "${{ inputs.test_target }}"

            $threadCount = [int]"${{ inputs.thread_count }}"
            $dataProviderThreadCount = [int]"${{ inputs.dataprovider_thread_count }}"

            if ("${{ inputs.headless }}" -eq "false") {
              $headless = "false"
            }
          }

          if ($framework -notin @("bdd", "testng")) {
            throw "Invalid framework selected."
          }

          if ($execution -notin @("serial", "parallel")) {
            throw "Invalid execution mode selected."
          }

          if ($browser -notin @("chrome", "edge", "firefox", "all")) {
            throw "Invalid browser selected."
          }

          if ($threadCount -lt 1 -or $threadCount -gt 32) {
            throw "Thread count must be between 1 and 32."
          }

          if ($dataProviderThreadCount -lt 1 -or $dataProviderThreadCount -gt 32) {
            throw "DataProvider thread count must be between 1 and 32."
          }

          if ($execution -eq "serial") {
            $threadCount = 1
            $dataProviderThreadCount = 1
          }

          if ($framework -eq "testng" -and
              $target -eq "src/test/resources/features/Login_Test.feature") {
            $target = ""
          }

          $profile = "$framework-$execution"

          "FRAMEWORK=$framework" >> $env:GITHUB_ENV
          "EXECUTION_MODE=$execution" >> $env:GITHUB_ENV
          "SELECTED_BROWSER=$browser" >> $env:GITHUB_ENV
          "HEADLESS=$headless" >> $env:GITHUB_ENV
          "MAVEN_PROFILE=$profile" >> $env:GITHUB_ENV
          "TEST_TARGET=$target" >> $env:GITHUB_ENV
          "THREAD_COUNT=$threadCount" >> $env:GITHUB_ENV
          "DATAPROVIDER_THREAD_COUNT=$dataProviderThreadCount" >> $env:GITHUB_ENV

          Write-Host "================================="
          Write-Host "TEST CONFIGURATION"
          Write-Host "================================="
          Write-Host "Framework: $framework"
          Write-Host "Execution: $execution"
          Write-Host "Browser: $browser"
          Write-Host "Headless: $headless"
          Write-Host "Profile: $profile"
          Write-Host "Target: $target"
          Write-Host "Threads: $threadCount"
          Write-Host "DataProvider threads: $dataProviderThreadCount"

      # ========================================
      # 4. VERIFY INSTALLED BROWSERS
      # No browser installation.
      # ========================================

      - name: Verify Installed Browsers
        shell: powershell
        run: |
          $selected = $env:SELECTED_BROWSER

          if ($selected -eq "all") {
            $browsers = @("chrome", "edge", "firefox")
          }
          else {
            $browsers = @($selected)
          }

          $browserPaths = @{
            chrome = @(
              "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
              "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
              "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
            )

            edge = @(
              "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
              "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
            )

            firefox = @(
              "$env:ProgramFiles\Mozilla Firefox\firefox.exe",
              "${env:ProgramFiles(x86)}\Mozilla Firefox\firefox.exe"
            )
          }

          foreach ($browser in $browsers) {

            $found = $browserPaths[$browser] |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1

            if (-not $found) {
              throw "$browser is not installed on this runner."
            }

            Write-Host "$browser verified: $found"
          }

      # ========================================
      # 5. RUN SELENIUM AUTOMATION
      # Reuses local Maven dependencies.
      # ========================================

      - name: Run Selenium Automation
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $framework = $env:FRAMEWORK
          $profile = $env:MAVEN_PROFILE
          $target = $env:TEST_TARGET
          $headless = $env:HEADLESS
          $threadCount = $env:THREAD_COUNT
          $dataProviderThreadCount = $env:DATAPROVIDER_THREAD_COUNT

          if ($env:SELECTED_BROWSER -eq "all") {
            $browsers = @("chrome", "edge", "firefox")
          }
          else {
            $browsers = @($env:SELECTED_BROWSER)
          }

          $failedBrowsers = @()

          New-Item -ItemType Directory -Force `
            -Path "ci-artifacts" | Out-Null

          $mvnPath = (Get-Command mvn.cmd -ErrorAction Stop).Source

          foreach ($browser in $browsers) {

            Write-Host ""
            Write-Host "========================================"
            Write-Host "STARTING $browser AUTOMATION"
            Write-Host "========================================"

            $mavenArgs = @(
              "-B",
              "-ntp",
              "clean",
              "test",
              "-P$profile",
              "-DBROWSER=$browser",
              "-DHEADLESS=$headless",
              "-DINCOGNITO=false",
              "-DREUSE_BROWSER=true",
              "-Dthread.count=$threadCount",
              "-Ddataprovider.thread.count=$dataProviderThreadCount"
            )

            if (-not [string]::IsNullOrWhiteSpace($target)) {

              if ($framework -eq "testng") {

                $className = $target.Trim()

                if ($className -notmatch '^[A-Za-z0-9_.$*]+$') {
                  throw "Invalid TestNG class name: $className"
                }

                Write-Host "TestNG class: $className"

                $mavenArgs += "-Dtest=$className"
              }
              elseif ($framework -eq "bdd") {

                $feature = $target.Trim()

                if (-not (Test-Path -LiteralPath $feature -PathType Leaf)) {
                  throw "Feature file does not exist: $feature"
                }

                if ($feature -notmatch '\.feature$') {
                  throw "BDD target must be a .feature file."
                }

                Write-Host "BDD feature: $feature"

                $mavenArgs += "-Dcucumber.features=$feature"
              }
            }
            else {
              Write-Host "Executing complete suite."
            }

            Write-Host "Framework: $framework"
            Write-Host "Profile: $profile"
            Write-Host "Browser: $browser"
            Write-Host "Headless: $headless"

            $browserArtifact = "ci-artifacts/$browser"

            New-Item -ItemType Directory -Force `
              -Path $browserArtifact | Out-Null

            $stdoutLog = Join-Path $browserArtifact "maven-stdout.log"
            $stderrLog = Join-Path $browserArtifact "maven-stderr.log"
            $combinedLog = Join-Path $browserArtifact "maven-execution.log"

            $quotedArgs = foreach ($argument in $mavenArgs) {
              '"' + $argument.Replace('"', '\"') + '"'
            }

            $argumentLine = $quotedArgs -join " "

            Write-Host "Starting Maven..."

            $process = Start-Process `
              -FilePath $mvnPath `
              -ArgumentList $argumentLine `
              -WorkingDirectory (Get-Location).Path `
              -RedirectStandardOutput $stdoutLog `
              -RedirectStandardError $stderrLog `
              -Wait `
              -PassThru `
              -NoNewWindow

            $testExitCode = $process.ExitCode

            if (Test-Path $stdoutLog) {
              Get-Content $stdoutLog |
                Set-Content $combinedLog

              Write-Host "========== MAVEN OUTPUT =========="
              Get-Content $stdoutLog
            }

            if (Test-Path $stderrLog) {
              Get-Content $stderrLog |
                Add-Content $combinedLog

              Write-Host "========== MAVEN ERRORS / WARNINGS =========="
              Get-Content $stderrLog
            }

            Write-Host "Maven exit code: $testExitCode"

            # Preserve TestNG reports.
            if (Test-Path "test-output") {
              Copy-Item "test-output" `
                "$browserArtifact/test-output" `
                -Recurse -Force
            }

            # Preserve Cucumber reports.
            if (Test-Path "target/cucumber-reports") {

              New-Item -ItemType Directory -Force `
                -Path "$browserArtifact/target" | Out-Null

              Copy-Item "target/cucumber-reports" `
                "$browserArtifact/target/cucumber-reports" `
                -Recurse -Force
            }

            # Preserve Surefire reports.
            if (Test-Path "target/surefire-reports") {

              New-Item -ItemType Directory -Force `
                -Path "$browserArtifact/target" | Out-Null

              Copy-Item "target/surefire-reports" `
                "$browserArtifact/target/surefire-reports" `
                -Recurse -Force
            }

            if ($testExitCode -ne 0) {
              Write-Host "$browser execution FAILED."
              $failedBrowsers += $browser
            }
            else {
              Write-Host "$browser execution PASSED."
            }
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "SELENIUM EXECUTION SUMMARY"
          Write-Host "========================================"

          if ($failedBrowsers.Count -gt 0) {
            Write-Host "Failed browsers: $($failedBrowsers -join ', ')"
            exit 1
          }

          Write-Host "All selected browser executions passed."

      # ========================================
      # 6. UPLOAD REPORTS AND LOGS ONCE
      # ========================================

      - name: Upload Automation Reports and Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Automation-Reports
          path: |
            ci-artifacts/**/maven-stdout.log
            ci-artifacts/**/maven-stderr.log
            ci-artifacts/**/maven-execution.log
            ci-artifacts/**/test-output/dashboard/ExecutionDashboard.html
            ci-artifacts/**/target/cucumber-reports/**
            ci-artifacts/**/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 7

      # ========================================
      # 7. EXECUTION SUMMARY
      # ========================================

      - name: Automation Execution Summary
        if: always()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "SELENIUM CI EXECUTION SUMMARY"
          Write-Host "======================================"

          Write-Host "Framework: $env:FRAMEWORK"
          Write-Host "Execution Mode: $env:EXECUTION_MODE"
          Write-Host "Browser: $env:SELECTED_BROWSER"
          Write-Host "Headless: $env:HEADLESS"
          Write-Host "Maven Profile: $env:MAVEN_PROFILE"
          Write-Host "Test Target: $env:TEST_TARGET"
          Write-Host "Thread Count: $env:THREAD_COUNT"
          Write-Host "DataProvider Threads: $env:DATAPROVIDER_THREAD_COUNT"

          Write-Host "======================================"
