name: Hybrid Selenium TestNG & Cucumber CI

on:
  workflow_dispatch:
    inputs:
      framework:
        description: 'Test Framework to Execute'
        required: true
        type: choice
        default: 'TestNG'
        options:
          - 'TestNG'
          - 'Cucumber BDD'

      browser:
        description: 'Target Browser'
        required: true
        type: choice
        default: 'Chrome'
        options:
          - 'Chrome'
          - 'Firefox'
          - 'Edge'
          - 'All'

      browser_mode:
        description: 'Browser Mode'
        required: true
        type: choice
        default: 'Headless'
        options:
          - 'Headless'
          - 'Headed'

      execution_mode:
        description: 'Browser Session Mode'
        required: true
        type: choice
        default: 'Incognito'
        options:
          - 'Normal'
          - 'Incognito'

      execution_strategy:
        description: 'Execution Strategy'
        required: true
        type: choice
        default: 'Serial'
        options:
          - 'Serial'
          - 'Parallel'

      thread_count:
        description: 'Parallel Thread Count (used when Execution Strategy is Parallel)'
        required: false
        type: string
        default: '2'

      test_class:
        description: 'Optional: Fully qualified class name (TestNG: tests.Create_Account | BDD: stepdefinitions.CreateAccount or feature path). Leave blank for full suite.'
        required: false
        type: string
        default: ''

      use_bdd_runner_class:
        description: 'Cucumber BDD only: Run via Runner class (runners.TestRunner / runners.ParallelTestRunner) instead of bdd-*.xml'
        required: false
        type: boolean
        default: false

      block_images:
        description: 'DriverFactory optimization: Block image downloads (-DBLOCK_IMAGES=true)'
        required: false
        type: boolean
        default: false

      runner:
        description: 'Runner Environment (use self-hosted for Windows 11 + Docker Desktop, or ubuntu-latest for GitHub-hosted Linux Docker)'
        required: true
        type: choice
        default: 'ubuntu-latest'
        options:
          - 'ubuntu-latest'
          - 'self-hosted'
          - 'windows-latest'

jobs:
  # ===========================================================================
  # 1. PREPARE BROWSER MATRIX (Handles Single Browser or "All")
  # ===========================================================================
  prepare:
    name: Prepare Execution Matrix
    runs-on: ubuntu-latest
    outputs:
      browsers: ${{ steps.set-matrix.outputs.browsers }}
    steps:
      - name: Resolve Target Browsers
        id: set-matrix
        shell: pwsh
        env:
          SELECTED_BROWSER: ${{ inputs.browser }}
        run: |
          $selected = $env:SELECTED_BROWSER.Trim().ToLowerInvariant()
          if ($selected -eq 'all') {
            $matrix = '["chrome","firefox","edge"]'
          } else {
            $matrix = "[\"$selected\"]"
          }
          "browsers=$matrix" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Resolved browser matrix: $matrix"

  # ===========================================================================
  # 2. DOCKER + MAVEN TEST EXECUTION + REPORT ARTIFACTS
  # ===========================================================================
  execute-tests:
    name: ${{ inputs.framework }} | ${{ matrix.browser }} | ${{ inputs.execution_strategy }}
    needs: prepare
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.prepare.outputs.browsers) }}

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 with Maven Dependency Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # -----------------------------------------------------------------------
      # Bind Configured GitHub Secrets/Variables into Env & src/main/java/env/.env
      # -----------------------------------------------------------------------
      - name: Configure Environment Variables & .env File
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL || vars.API_BASE_URL }}
          BASE_URL: ${{ secrets.BASE_URL || vars.BASE_URL }}
          DB_URL: ${{ secrets.DB_URL || vars.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME || vars.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || vars.DB_PASSWORD }}
          LOGIN_USERNAME: ${{ secrets.LOGIN_USERNAME || vars.LOGIN_USERNAME }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD || vars.LOGIN_PASSWORD }}
        run: |
          $requiredKeys = @(
            'API_BASE_URL',
            'BASE_URL',
            'DB_URL',
            'DB_USERNAME',
            'DB_PASSWORD',
            'LOGIN_USERNAME',
            'LOGIN_PASSWORD'
          )

          $missing = @()
          foreach ($key in $requiredKeys) {
            $val = [Environment]::GetEnvironmentVariable($key)
            if ([string]::IsNullOrWhiteSpace($val)) {
              $missing += $key
            }
          }

          if ($missing.Count -gt 0) {
            throw "Missing required GitHub Secrets/Variables: $($missing -join ', ')"
          }

          $envFilePath = Join-Path (Get-Location).Path (Join-Path "src" (Join-Path "main" (Join-Path "java" (Join-Path "env" ".env"))))
          $envBackupPath = "$envFilePath.ci.bak"
          $envDir = Split-Path -Path $envFilePath -Parent
          if (-not (Test-Path $envDir)) {
            New-Item -ItemType Directory -Path $envDir -Force | Out-Null
          }

          $existingLines = @()
          if (Test-Path $envFilePath) {
            Copy-Item -Path $envFilePath -Destination $envBackupPath -Force
            "RESTORE_ENV_FILE=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $existingLines = Get-Content -Path $envFilePath -ErrorAction SilentlyContinue
          } else {
            "GENERATED_ENV_FILE=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

          $managedSet = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          foreach ($k in $requiredKeys) { [void]$managedSet.Add($k) }

          $outputLines = New-Object System.Collections.Generic.List[string]
          foreach ($line in $existingLines) {
            if ($line -match '^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=') {
              if ($managedSet.Contains($Matches[1])) {
                continue
              }
            }
            $outputLines.Add($line)
          }

          foreach ($key in $requiredKeys) {
            $val = [Environment]::GetEnvironmentVariable($key)

            # Export to subsequent steps (available via System.getenv in Java/Maven)
            "$key=$val" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

            # Write to src/main/java/env/.env (available via java-dotenv)
            $outputLines.Add("$key=$val")
          }

          # Write UTF-8 without BOM so java-dotenv parses the first key cleanly
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllLines($envFilePath, $outputLines, $utf8NoBom)

          Write-Host "Validated and configured all 7 environment variables."

      # -----------------------------------------------------------------------
      # Start Kill Bill + KAUI + MariaDB Docker Stack
      # -----------------------------------------------------------------------
      - name: Start Kill Bill Docker Containers
        run: |
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
            throw "Docker CLI is not installed or not in PATH on this runner."
          }

          $dockerOs = (docker info --format '{{.OSType}}' 2>&1)
          if ($LASTEXITCODE -ne 0) {
            throw "Docker daemon is not running: $dockerOs"
          }
          Write-Host "Docker Engine OS Type: $dockerOs"
          if ($dockerOs.Trim().ToLowerInvariant() -ne 'linux') {
            throw "Kill Bill, KAUI, and MariaDB require Linux Docker containers, but this runner is running '$dockerOs' containers. Switch the runner input to 'self-hosted' (Windows 11 with Docker Desktop Linux containers) or 'ubuntu-latest' (GitHub-hosted)."
          }

          $composeContent = @'
          version: '3.2'

          volumes:
            db:

          services:
            killbill:
              image: killbill/killbill:0.24.16
              depends_on:
                - db
              restart: on-failure
              ports:
                - "8080:8080"
              environment:
                - KILLBILL_DAO_URL=jdbc:mysql://db:3306/killbill
                - KILLBILL_DAO_USER=root
                - KILLBILL_DAO_PASSWORD=killbill
                - KILLBILL_CATALOG_URI=SpyCarAdvanced.xml

            kaui:
              image: killbill/kaui:4.0.4
              depends_on:
                - db
                - killbill
              restart: on-failure
              ports:
                - "9090:8080"
              environment:
                - KAUI_CONFIG_DAO_URL=jdbc:mysql://db:3306/kaui
                - KAUI_CONFIG_DAO_USER=root
                - KAUI_CONFIG_DAO_PASSWORD=killbill
                - KAUI_KILLBILL_URL=http://killbill:8080

            db:
              image: killbill/mariadb:0.24
              volumes:
                - type: volume
                  source: db
                  target: /var/lib/mysql
              ports:
                - "127.0.0.1:3307:3306"
              expose:
                - "3306"
              environment:
                - MYSQL_ROOT_PASSWORD=killbill
          '@

          Set-Content -Path "docker-compose.ci.yml" -Value $composeContent -Encoding utf8

          Write-Host "Starting Kill Bill, KAUI, and MariaDB containers..."
          docker compose -f docker-compose.ci.yml up -d
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to start Docker Compose stack."
          }

      - name: Wait for MariaDB, Kill Bill, and KAUI Readiness
        run: |
          $maxAttempts = 60
          $sleepSeconds = 5
          $dbReady = $false
          $kbReady = $false
          $kauiReady = $false

          for ($i = 1; $i -le $maxAttempts; $i++) {
            if (-not $dbReady) {
              try {
                $tcp = New-Object System.Net.Sockets.TcpClient
                $async = $tcp.BeginConnect("127.0.0.1", 3307, $null, $null)
                if ($async.AsyncWaitHandle.WaitOne(2000, $false) -and $tcp.Connected) {
                  $dbReady = $true
                  Write-Host "[Attempt $i] MariaDB port 3307 is reachable."
                }
                $tcp.Close()
              } catch { }
            }

            if (-not $kbReady) {
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8080/1.0/healthcheck" -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop
                if ($resp.StatusCode -eq 200) {
                  $kbReady = $true
                  Write-Host "[Attempt $i] Kill Bill healthcheck returned 200."
                }
              } catch { }
            }

            if (-not $kauiReady) {
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:9090" -UseBasicParsing -TimeoutSec 5 -MaximumRedirection 5 -ErrorAction Stop
                if ($resp.StatusCode -ge 200 -and $resp.StatusCode -lt 400) {
                  $kauiReady = $true
                  Write-Host "[Attempt $i] KAUI returned $($resp.StatusCode)."
                }
              } catch { }
            }

            if ($dbReady -and $kbReady -and $kauiReady) {
              Write-Host "All services (MariaDB, Kill Bill, KAUI) are ready."
              exit 0
            }

            Write-Host "[Attempt $i/$maxAttempts] Waiting... (DB=$dbReady, KillBill=$kbReady, KAUI=$kauiReady)"
            Start-Sleep -Seconds $sleepSeconds
          }

          Write-Host "::error::Timed out waiting for Kill Bill stack readiness."
          docker compose -f docker-compose.ci.yml ps
          docker compose -f docker-compose.ci.yml logs --tail=100
          exit 1

      # -----------------------------------------------------------------------
      # Execute Selected Framework (TestNG OR Cucumber BDD Only)
      # -----------------------------------------------------------------------
      - name: Execute Automated Tests
        env:
          FRAMEWORK: ${{ inputs.framework }}
          BROWSER: ${{ matrix.browser }}
          BROWSER_MODE: ${{ inputs.browser_mode }}
          EXECUTION_MODE: ${{ inputs.execution_mode }}
          EXECUTION_STRATEGY: ${{ inputs.execution_strategy }}
          THREAD_COUNT: ${{ inputs.thread_count }}
          TEST_CLASS: ${{ inputs.test_class }}
          USE_BDD_RUNNER_CLASS: ${{ inputs.use_bdd_runner_class }}
          BLOCK_IMAGES: ${{ inputs.block_images }}
        run: |
          $framework = $env:FRAMEWORK.Trim()
          $browser = $env:BROWSER.Trim().ToLowerInvariant()
          $headless = ($env:BROWSER_MODE.Trim().ToLowerInvariant() -eq 'headless').ToString().ToLowerInvariant()
          $incognito = ($env:EXECUTION_MODE.Trim().ToLowerInvariant() -eq 'incognito').ToString().ToLowerInvariant()
          $isParallel = ($env:EXECUTION_STRATEGY.Trim().ToLowerInvariant() -eq 'parallel')
          $useBddRunnerClass = ($env:USE_BDD_RUNNER_CLASS -eq 'true')
          $blockImages = ($env:BLOCK_IMAGES -eq 'true')
          $rawTestClass = if ($null -ne $env:TEST_CLASS) { $env:TEST_CLASS.Trim() } else { '' }

          $parsedThreads = 1
          if ($isParallel) {
            if ([int]::TryParse($env:THREAD_COUNT, [ref]$parsedThreads) -and $parsedThreads -ge 1) {
              # valid
            } else {
              $parsedThreads = 2
            }
          }

          $surefireParallel = if ($isParallel) { 'classes' } else { 'none' }

          $mvnArgs = New-Object System.Collections.Generic.List[string]
          $mvnArgs.Add("test")
          $mvnArgs.Add("-B")
          $mvnArgs.Add("-Dbrowser=$browser")
          $mvnArgs.Add("-Dheadless=$headless")
          $mvnArgs.Add("-Dincognito=$incognito")
          $mvnArgs.Add("-Dexecution.mode=$surefireParallel")
          $mvnArgs.Add("-Dthread.count=$parsedThreads")
          $mvnArgs.Add("-Ddataprovider.thread.count=$parsedThreads")

          $jvmArgLine = New-Object System.Collections.Generic.List[string]
          if ($blockImages) {
            $jvmArgLine.Add("-DBLOCK_IMAGES=true")
          }

          function Normalize-ClassName([string]$inputVal) {
            $val = $inputVal.Trim()
            $val = $val -replace '^src[\\/]+test[\\/]+java[\\/]+', ''
            $val = $val -replace '\.java$', ''
            $val = $val -replace '[\\/]+', '.'
            return $val
          }

          function Use-SuiteXml([string]$suiteFile) {
            if (-not (Test-Path $suiteFile)) {
              throw "Expected suite XML file not found: $suiteFile"
            }
            if (-not (Test-Path "testng.xml")) {
              "GENERATED_TESTNG_XML=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
            Copy-Item -Path $suiteFile -Destination "testng.xml" -Force
            $mvnArgs.Add("-Dsurefire.suiteXmlFiles=$suiteFile")
            Write-Host "Using suite XML: $suiteFile"
          }

          if ($framework -eq 'TestNG') {
            Write-Host "=== Framework: TestNG ==="
            if (-not [string]::IsNullOrWhiteSpace($rawTestClass)) {
              $fqn = Normalize-ClassName $rawTestClass
              $javaRelPath = Join-Path "src" (Join-Path "test" (Join-Path "java" (($fqn -replace '\.', [IO.Path]::DirectorySeparatorChar) + ".java")))
              if (-not (Test-Path $javaRelPath)) {
                $available = (Get-ChildItem -Path "src/test/java/tests" -Filter "*.java" -ErrorAction SilentlyContinue | ForEach-Object { "tests.$($_.BaseName)" }) -join ", "
                throw "TestNG class '$fqn' not found at '$javaRelPath'. Available classes in src/test/java/tests: $available"
              }
              $mvnArgs.Add("-Dtest=$fqn")
              $mvnArgs.Add("-DfailIfNoTests=true")
              Write-Host "Running individual TestNG class: $fqn"
            } else {
              $suiteXml = if ($isParallel) { "testng-parallel.xml" } else { "testng-serial.xml" }
              Use-SuiteXml $suiteXml
            }
          }
          elseif ($framework -eq 'Cucumber BDD') {
            Write-Host "=== Framework: Cucumber BDD ==="
            $runnerClass = if ($isParallel) { "runners.ParallelTestRunner" } else { "runners.TestRunner" }

            if (-not [string]::IsNullOrWhiteSpace($rawTestClass)) {
              if ($rawTestClass -match '\.feature$') {
                $featurePath = $rawTestClass -replace '\\', '/'
                if (-not (Test-Path $featurePath)) {
                  $candidate = "src/test/resources/features/$featurePath"
                  if (Test-Path $candidate) { $featurePath = $candidate }
                }
                if (-not (Test-Path $featurePath)) {
                  throw "Feature file not found: $featurePath"
                }
                $mvnArgs.Add("-Dtest=$runnerClass")
                $mvnArgs.Add("-DfailIfNoTests=true")
                $jvmArgLine.Add("-Dcucumber.features=$featurePath")
                Write-Host "Running Cucumber feature '$featurePath' via $runnerClass"
              } else {
                $fqn = Normalize-ClassName $rawTestClass
                $javaRelPath = Join-Path "src" (Join-Path "test" (Join-Path "java" (($fqn -replace '\.', [IO.Path]::DirectorySeparatorChar) + ".java")))
                if (-not (Test-Path $javaRelPath)) {
                  $available = (Get-ChildItem -Path "src/test/java/stepdefinitions" -Filter "*.java" -ErrorAction SilentlyContinue | ForEach-Object { "stepdefinitions.$($_.BaseName)" }) -join ", "
                  throw "Step definition class '$fqn' not found at '$javaRelPath'. Available classes in src/test/java/stepdefinitions: $available"
                }

                $javaContent = Get-Content -Path $javaRelPath -Raw
                $hasCucumberSteps = $javaContent -match '@(Given|When|Then|And|But)\s*\('
                $hasTestNgTest = $javaContent -match '@Test\b'

                if ($hasTestNgTest -and -not $hasCucumberSteps) {
                  $mvnArgs.Add("-Dtest=$fqn")
                  $mvnArgs.Add("-DfailIfNoTests=true")
                  Write-Host "Class '$fqn' contains TestNG @Test methods without Cucumber annotations. Executing directly."
                } else {
                  $featureFiles = Get-ChildItem -Path "src/test/resources/features" -Filter "*.feature" -Recurse
                  $simpleName = ($fqn -split '\.')[-1]
                  $stemNoSteps = $simpleName -replace 'Steps$', ''

                  $matchedFeatures = $featureFiles | Where-Object {
                    $_.BaseName -ieq $simpleName -or $_.BaseName -ieq $stemNoSteps
                  }

                  if ($matchedFeatures.Count -eq 0) {
                    $stepMatches = [regex]::Matches($javaContent, '@(?:Given|When|Then|And|But)\s*\(\s*"([^"]+)"')
                    $stepPatterns = @()
                    foreach ($m in $stepMatches) {
                      $expr = $m.Groups[1].Value -replace '^\^', '' -replace '\$$', ''
                      $loose = [regex]::Escape($expr)
                      $loose = $loose -replace '\\\{[^\}]+\\\}', '.*'
                      $loose = $loose -replace '\\\([^\)]+\\\)', '.*'
                      if ($loose.Length -ge 6) {
                        $stepPatterns += $loose
                      }
                    }

                    $scored = @()
                    foreach ($ff in $featureFiles) {
                      $fContent = Get-Content -Path $ff.FullName -Raw
                      $hits = 0
                      foreach ($pat in $stepPatterns) {
                        if ($fContent -match $pat) { $hits++ }
                      }
                      if ($hits -gt 0) {
                        $scored += [PSCustomObject]@{ File = $ff; Hits = $hits }
                      }
                    }

                    if ($scored.Count -gt 0) {
                      $maxHits = ($scored | Measure-Object -Property Hits -Maximum).Maximum
                      $matchedFeatures = ($scored | Where-Object { $_.Hits -eq $maxHits }).File
                    }
                  }

                  if ($matchedFeatures.Count -eq 0) {
                    $availableFeatures = ($featureFiles | ForEach-Object { $_.Name }) -join ", "
                    throw "Could not match step definition class '$fqn' to a feature file. Available features: $availableFeatures. You may also enter the .feature file path directly."
                  }

                  $featureArg = ($matchedFeatures | ForEach-Object {
                    $rel = [IO.Path]::GetRelativePath((Get-Location).Path, $_.FullName)
                    $rel -replace '\\', '/'
                  }) -join ","

                  $mvnArgs.Add("-Dtest=$runnerClass")
                  $mvnArgs.Add("-DfailIfNoTests=true")
                  $jvmArgLine.Add("-Dcucumber.features=$featureArg")
                  Write-Host "Mapped step definition class '$fqn' -> feature(s): $featureArg"
                  Write-Host "Running via $runnerClass"
                }
              }
            } else {
              if ($useBddRunnerClass) {
                $mvnArgs.Add("-Dtest=$runnerClass")
                $mvnArgs.Add("-DfailIfNoTests=true")
                Write-Host "Running Cucumber BDD Runner class: $runnerClass"
              } else {
                $suiteXml = if ($isParallel) { "bdd-parallel.xml" } else { "bdd-serial.xml" }
                Use-SuiteXml $suiteXml
              }
            }
          }
          else {
            throw "Unsupported framework selection: $framework"
          }

          if ($jvmArgLine.Count -gt 0) {
            $mvnArgs.Add("-DargLine=$($jvmArgLine -join ' ')")
          }

          Write-Host "Executing: mvn $($mvnArgs -join ' ')"

          if ($IsLinux -and $headless -eq 'false' -and (Get-Command xvfb-run -ErrorAction SilentlyContinue)) {
            & xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" mvn @mvnArgs
          } else {
            & mvn @mvnArgs
          }

          $exitCode = $LASTEXITCODE
          Write-Host "Maven exited with code: $exitCode"
          exit $exitCode

      # -----------------------------------------------------------------------
      # Upload Separate Artifacts (Always Runs Even on Test Failure)
      # -----------------------------------------------------------------------
      - name: Upload TestNG Dashboard & Reports
        if: always() && inputs.framework == 'TestNG'
        uses: actions/upload-artifact@v4
        with:
          name: testng-reports-${{ matrix.browser }}
          path: |
            test-output/
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Cucumber HTML & JSON Reports
        if: always() && inputs.framework == 'Cucumber BDD'
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports-${{ matrix.browser }}
          path: |
            target/cucumber-reports/cucumber.html
            target/cucumber-reports/cucumber.json
          if-no-files-found: warn
          retention-days: 14

      # -----------------------------------------------------------------------
      # Capture Docker Logs on Failure & Always Tear Down Containers
      # -----------------------------------------------------------------------
      - name: Dump Docker Logs on Failure
        if: failure()
        run: |
          if (Test-Path "docker-compose.ci.yml") {
            docker compose -f docker-compose.ci.yml ps
            docker compose -f docker-compose.ci.yml logs --tail=150
          }

      - name: Stop Docker Containers & Clean Temporary CI Files
        if: always()
        run: |
          if (Test-Path "docker-compose.ci.yml") {
            Write-Host "Stopping and removing Kill Bill Docker containers and volumes..."
            docker compose -f docker-compose.ci.yml down -v --remove-orphans
            Remove-Item -Path "docker-compose.ci.yml" -Force -ErrorAction SilentlyContinue
          }

          if ($env:GENERATED_TESTNG_XML -eq 'true' -and (Test-Path "testng.xml")) {
            Remove-Item -Path "testng.xml" -Force -ErrorAction SilentlyContinue
          }

          $envFilePath = Join-Path (Get-Location).Path (Join-Path "src" (Join-Path "main" (Join-Path "java" (Join-Path "env" ".env"))))
          $envBackupPath = "$envFilePath.ci.bak"

          if ($env:RESTORE_ENV_FILE -eq 'true' -and (Test-Path $envBackupPath)) {
            Move-Item -Path $envBackupPath -Destination $envFilePath -Force
          } elseif ($env:GENERATED_ENV_FILE -eq 'true' -and (Test-Path $envFilePath)) {
            Remove-Item -Path $envFilePath -Force -ErrorAction SilentlyContinue
          }
