
name: Windows Selenium CI

on:
  workflow_dispatch:
    inputs:
      framework:
        description: "Test framework"
        required: true
        type: choice
        options:
          - bdd
          - testng
        default: bdd

      execution:
        description: "Execution mode"
        required: true
        type: choice
        options:
          - serial
          - parallel
        default: serial

      browser:
        description: "Browser"
        required: true
        type: choice
        options:
          - chrome
          - edge
          - firefox
          - all
        default: chrome

      headless:
        description: "Run browser in headless mode"
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "true"

      class_name:
        description: "TestNG class name (optional, without .java)"
        required: false
        type: string
        default: ""

      feature_file:
        description: "BDD feature file (optional)"
        required: false
        type: string
        default: "src/test/resources/features/Login_Test.feature"

      thread_count:
        description: "Parallel thread count"
        required: false
        type: string
        default: "4"

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  selenium-tests:
    name: Selenium ${{ github.event_name == 'workflow_dispatch' && inputs.framework || 'bdd' }} CI
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120

    defaults:
      run:
        shell: powershell

    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      BASE_URL: ${{ vars.BASE_URL }}
      DB_URL: ${{ vars.DB_URL }}
      DB_USERNAME: ${{ vars.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      LOGIN_USERNAME: ${{ vars.LOGIN_USERNAME }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}

    steps:
      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. VERIFY EXISTING JAVA AND MAVEN
      # --------------------------------------------------
      - name: Verify Windows CI environment
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "================================="
          Write-Host "WINDOWS SELENIUM CI ENVIRONMENT"
          Write-Host "================================="

          Write-Host "`nJAVA_HOME: $env:JAVA_HOME"

          # Read Java version through cmd.exe.
          # java -version writes to stderr, which can trigger
          # NativeCommandError in PowerShell when captured directly.
          $javaOutput = & $env:ComSpec /d /c "java -version 2>&1"

          if ($LASTEXITCODE -ne 0) {
              throw "Java is not available on PATH."
          }

          $javaVersion = $javaOutput -join "`n"
          Write-Host $javaVersion

          if ($javaVersion -notmatch 'version "(\d+)') {
              throw "Could not identify the installed Java version."
          }

          $javaMajor = [int]$Matches[1]

          if ($javaMajor -lt 17) {
              throw "Java 17 or newer is required. Found Java $javaMajor."
          }

          Write-Host "Java $javaMajor detected successfully."

          if ($env:JAVA_HOME) {
              if (-not (Test-Path "$env:JAVA_HOME\bin\java.exe")) {
                  throw "JAVA_HOME is set, but java.exe was not found in JAVA_HOME\bin."
              }
          }

          Write-Host "`nChecking Maven..."

          $mavenOutput = & $env:ComSpec /d /c "mvn -version 2>&1"

          if ($LASTEXITCODE -ne 0) {
              throw "Maven is not available. Check Maven installation and PATH."
          }

          $mavenOutput | ForEach-Object { Write-Host $_ }

          if (-not (Test-Path "pom.xml")) {
              throw "pom.xml was not found in the repository root."
          }

          Write-Host "`nChecking existing Maven repository..."

          $mavenRepo = Join-Path $env:USERPROFILE ".m2\repository"

          if (Test-Path $mavenRepo) {
              Write-Host "Existing Maven repository found: $mavenRepo"
          }
          else {
              Write-Host "Maven repository does not exist yet. Maven will create it."
          }

          Write-Host "`nEnvironment verification completed."

      # --------------------------------------------------
      # 3. VERIFY BROWSERS
      # --------------------------------------------------
      - name: Verify installed browsers
        run: |
          $ErrorActionPreference = "Stop"

          $browserPaths = @{
              chrome = @(
                  "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
                  "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
                  "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
              )
              edge = @(
                  "$env:ProgramFiles(x86)\Microsoft\Edge\Application\msedge.exe",
                  "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
              )
              firefox = @(
                  "$env:ProgramFiles\Mozilla Firefox\firefox.exe",
                  "${env:ProgramFiles(x86)}\Mozilla Firefox\firefox.exe"
              )
          }

          foreach ($browser in $browserPaths.Keys) {
              $found = $false

              foreach ($path in $browserPaths[$browser]) {
                  if ($path -and (Test-Path $path)) {
                      Write-Host "$browser installed: $path"
                      $found = $true
                      break
                  }
              }

              if (-not $found) {
                  Write-Host "$browser executable was not found."
              }
          }

      # --------------------------------------------------
      # 4. CONFIGURE EXECUTION
      # --------------------------------------------------
      - name: Configure test execution
        id: config
        run: |
          $ErrorActionPreference = "Stop"

          $framework = "${{ github.event_name == 'workflow_dispatch' && inputs.framework || 'bdd' }}".ToLower()
          $execution = "${{ github.event_name == 'workflow_dispatch' && inputs.execution || 'serial' }}".ToLower()
          $browser = "${{ github.event_name == 'workflow_dispatch' && inputs.browser || 'chrome' }}".ToLower()
          $headless = "${{ github.event_name == 'workflow_dispatch' && inputs.headless || 'true' }}".ToLower()
          $className = "${{ github.event_name == 'workflow_dispatch' && inputs.class_name || '' }}".Trim()
          $featureFile = "${{ github.event_name == 'workflow_dispatch' && inputs.feature_file || 'src/test/resources/features/Login_Test.feature' }}".Trim()
          $threadCount = "${{ github.event_name == 'workflow_dispatch' && inputs.thread_count || '4' }}".Trim()

          if ($framework -notin @("bdd", "testng")) {
              throw "Invalid framework: $framework"
          }

          if ($execution -notin @("serial", "parallel")) {
              throw "Invalid execution mode: $execution"
          }

          if ($browser -notin @("chrome", "edge", "firefox", "all")) {
              throw "Invalid browser: $browser"
          }

          if ($headless -notin @("true", "false")) {
              throw "Invalid headless value: $headless"
          }

          if ($threadCount -notmatch '^\d+$' -or [int]$threadCount -lt 1) {
              throw "Thread count must be a positive integer."
          }

          if ($execution -eq "serial") {
              $threadCount = "1"
          }

          if ($framework -eq "testng") {
              if ($className -and $className -notmatch '^[a-zA-Z_][a-zA-Z0-9_]*$') {
                  throw "Enter a valid TestNG class name without .java."
              }

              $featureFile = ""
          }
          else {
              if ($className) {
                  Write-Host "Ignoring TestNG class name because BDD was selected."
              }

              if ($featureFile -and -not (Test-Path $featureFile)) {
                  throw "BDD feature file not found: $featureFile"
              }
          }

          $profile = "$framework-$execution"

          $browsers = @()

          if ($browser -eq "all") {
              $browsers = @("chrome", "edge", "firefox")
          }
          else {
              $browsers = @($browser)
          }

          "FRAMEWORK=$framework" | Out-File -FilePath $env:GITHUB_ENV -Append
          "EXECUTION=$execution" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PROFILE=$profile" | Out-File -FilePath $env:GITHUB_ENV -Append
          "HEADLESS=$headless" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CLASS_NAME=$className" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FEATURE_FILE=$featureFile" | Out-File -FilePath $env:GITHUB_ENV -Append
          "THREAD_COUNT=$threadCount" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BROWSERS=$($browsers -join ',')" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "================================="
          Write-Host "EXECUTION CONFIGURATION"
          Write-Host "================================="
          Write-Host "Framework: $framework"
          Write-Host "Execution: $execution"
          Write-Host "Profile: $profile"
          Write-Host "Browsers: $($browsers -join ', ')"
          Write-Host "Headless: $headless"
          Write-Host "Threads: $threadCount"
          Write-Host "TestNG class: $className"
          Write-Host "BDD feature: $featureFile"

      # --------------------------------------------------
      # 5. RUN MAVEN TESTS
      # --------------------------------------------------
      - name: Execute Selenium tests
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path "ci-artifacts" | Out-Null

          $browsers = $env:BROWSERS.Split(",")

          foreach ($browser in $browsers) {

              Write-Host ""
              Write-Host "================================="
              Write-Host "RUNNING TESTS: $browser"
              Write-Host "================================="

              $browserArtifactDir = Join-Path "ci-artifacts" $browser
              New-Item -ItemType Directory -Force -Path $browserArtifactDir | Out-Null

              $stdoutLog = Join-Path $browserArtifactDir "maven-stdout.log"
              $stderrLog = Join-Path $browserArtifactDir "maven-stderr.log"
              $executionLog = Join-Path $browserArtifactDir "execution.log"

              $mavenArgs = @(
                  "-B"
                  "-ntp"
                  "clean"
                  "test"
                  "-P$env:PROFILE"
                  "-DBROWSER=$browser"
                  "-DHEADLESS=$env:HEADLESS"
                  "-DINCOGNITO=false"
                  "-DREUSE_BROWSER=true"
                  "-Dthread.count=$env:THREAD_COUNT"
                  "-Ddataprovider.thread.count=$env:THREAD_COUNT"
              )

              if ($env:FRAMEWORK -eq "testng" -and $env:CLASS_NAME) {
                  $mavenArgs += "-Dtest=$env:CLASS_NAME"
              }

              if ($env:FRAMEWORK -eq "bdd" -and $env:FEATURE_FILE) {
                  $mavenArgs += "-Dcucumber.features=$env:FEATURE_FILE"
              }

              # Quote individual arguments when necessary.
              $quotedArgs = foreach ($arg in $mavenArgs) {
                  if ($arg -match '\s') {
                      '"' + $arg + '"'
                  }
                  else {
                      $arg
                  }
              }

              $commandLine = "mvn.cmd $($quotedArgs -join ' ') 1> `"$stdoutLog`" 2> `"$stderrLog`""

              Write-Host "Maven command:"
              Write-Host "mvn.cmd $($mavenArgs -join ' ')"

              Add-Content -Path $executionLog -Value "Browser: $browser"
              Add-Content -Path $executionLog -Value "Profile: $env:PROFILE"
              Add-Content -Path $executionLog -Value "Started: $(Get-Date)"

              # Run Maven through cmd.exe. Output is redirected to files,
              # avoiding PowerShell's native stderr error conversion.
              & $env:ComSpec /d /c $commandLine

              $mavenExitCode = $LASTEXITCODE

              Add-Content -Path $executionLog -Value "Finished: $(Get-Date)"
              Add-Content -Path $executionLog -Value "Exit code: $mavenExitCode"

              Write-Host "`nMaven output:"
              if (Test-Path $stdoutLog) {
                  Get-Content $stdoutLog -Tail 80
              }

              if (Test-Path $stderrLog) {
                  Write-Host "`nMaven stderr:"
                  Get-Content $stderrLog -Tail 40
              }

              # Preserve reports before the next browser's clean build.
              if (Test-Path "test-output") {
                  Copy-Item "test-output" `
                    (Join-Path $browserArtifactDir "test-output") `
                    -Recurse -Force
              }

              if (Test-Path "target\cucumber-reports") {
                  Copy-Item "target\cucumber-reports" `
                    (Join-Path $browserArtifactDir "cucumber-reports") `
                    -Recurse -Force
              }

              if (Test-Path "target\surefire-reports") {
                  Copy-Item "target\surefire-reports" `
                    (Join-Path $browserArtifactDir "surefire-reports") `
                    -Recurse -Force
              }

              if ($mavenExitCode -ne 0) {
                  throw "Maven tests failed for $browser. Exit code: $mavenExitCode"
              }
          }

      # --------------------------------------------------
      # 6. UPLOAD REPORTS AND LOGS
      # --------------------------------------------------
      - name: Upload test reports and execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-ci-reports-${{ github.run_number }}
          path: |
            ci-artifacts/
          if-no-files-found: warn
          retention-days: 7

      # --------------------------------------------------
      # 7. GITHUB SUMMARY
      # --------------------------------------------------
      - name: Publish execution summary
        if: always()
        run: |
          @"
          ## Windows Selenium CI Execution

          | Setting | Value |
          |---|---|
          | Framework | $env:FRAMEWORK |
          | Execution | $env:EXECUTION |
          | Maven Profile | $env:PROFILE |
          | Browser(s) | $env:BROWSERS |
          | Headless | $env:HEADLESS |
          | Thread Count | $env:THREAD_COUNT |
          | TestNG Class | $env:CLASS_NAME |
          | BDD Feature | $env:FEATURE_FILE |

          **Reports and logs:** Download the workflow artifact from this run.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
