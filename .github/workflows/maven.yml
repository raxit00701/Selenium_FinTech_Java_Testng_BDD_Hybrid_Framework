
name: Selenium Java Automation

on:
  workflow_dispatch:
    inputs:
      framework:
        description: "Select testing framework"
        required: true
        default: "bdd"
        type: choice
        options:
          - bdd
          - testng

      execution_mode:
        description: "Select execution mode"
        required: true
        default: "serial"
        type: choice
        options:
          - serial
          - parallel

      browser:
        description: "Select browser"
        required: true
        default: "chrome"
        type: choice
        options:
          - chrome
          - edge
          - firefox

      headless:
        description: "Run browser in headless mode"
        required: true
        default: true
        type: boolean

      test_target:
        description: "TestNG class name or BDD feature file path (leave empty for all)"
        required: false
        default: ""

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: selenium-automation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  automation:
    name: Selenium Automation Tests
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90

    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      BASE_URL: ${{ vars.BASE_URL }}
      DB_URL: ${{ vars.DB_URL }}
      DB_USERNAME: ${{ vars.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      LOGIN_USERNAME: ${{ vars.LOGIN_USERNAME }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Java and Maven
        shell: powershell
        run: |
          Write-Host "Java Version:"
          java -version

          Write-Host "Maven Version:"
          mvn -version

          Write-Host "Working Directory:"
          Get-Location

      - name: Verify Installed Browsers
        shell: powershell
        run: |
          $browsers = @(
            "chrome",
            "msedge",
            "firefox"
          )

          foreach ($browser in $browsers) {
            $command = Get-Command $browser -ErrorAction SilentlyContinue

            if ($command) {
              Write-Host "$browser is available."
            }
            else {
              Write-Host "$browser command was not found in PATH."
            }
          }

      - name: Resolve Maven Dependencies
        shell: powershell
        run: |
          mvn -B -ntp dependency:resolve

          if ($LASTEXITCODE -ne 0) {
            throw "Maven dependency resolution failed."
          }

      - name: Select Test Configuration
        id: config
        shell: powershell
        run: |
          $framework = "bdd"
          $execution = "serial"
          $browser = "chrome"
          $headless = "true"
          $target = ""

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $framework = "${{ inputs.framework }}"
            $execution = "${{ inputs.execution_mode }}"
            $browser = "${{ inputs.browser }}"
            $target = "${{ inputs.test_target }}"
            
            if ("${{ inputs.headless }}" -eq "false") {
              $headless = "false"
            }
          }

          if ([string]::IsNullOrWhiteSpace($framework)) {
            $framework = "bdd"
          }

          if ([string]::IsNullOrWhiteSpace($execution)) {
            $execution = "serial"
          }

          if ([string]::IsNullOrWhiteSpace($browser)) {
            $browser = "chrome"
          }

          if ($framework -notin @("bdd", "testng")) {
            throw "Invalid framework: $framework"
          }

          if ($execution -notin @("serial", "parallel")) {
            throw "Invalid execution mode: $execution"
          }

          if ($browser -notin @("chrome", "edge", "firefox")) {
            throw "Invalid browser: $browser"
          }

          if ($framework -eq "bdd") {
            $profile = "bdd-$execution"
          }
          else {
            $profile = "testng-$execution"
          }

          "FRAMEWORK=$framework" >> $env:GITHUB_ENV
          "EXECUTION_MODE=$execution" >> $env:GITHUB_ENV
          "BROWSER=$browser" >> $env:GITHUB_ENV
          "HEADLESS=$headless" >> $env:GITHUB_ENV
          "PROFILE=$profile" >> $env:GITHUB_ENV
          "TEST_TARGET=$target" >> $env:GITHUB_ENV

          Write-Host "Framework: $framework"
          Write-Host "Execution: $execution"
          Write-Host "Browser: $browser"
          Write-Host "Headless: $headless"
          Write-Host "Maven Profile: $profile"
          Write-Host "Test Target: $target"

      - name: Execute Automation Tests
        shell: powershell
        run: |
          $mavenArgs = @(
            "-B",
            "-ntp",
            "clean",
            "test",
            "-P$env:PROFILE",
            "-DBROWSER=$env:BROWSER",
            "-DHEADLESS=$env:HEADLESS",
            "-DINCOGNITO=false",
            "-DREUSE_BROWSER=true"
          )

          if (-not [string]::IsNullOrWhiteSpace($env:TEST_TARGET)) {

            if ($env:FRAMEWORK -eq "testng") {
              Write-Host "Executing individual TestNG class: $env:TEST_TARGET"

              $className = $env:TEST_TARGET.Trim()

              if ($className -notmatch '^[A-Za-z0-9_.$*]+$') {
                throw "Invalid TestNG class name."
              }

              $mavenArgs += "-Dtest=$className"
            }
            elseif ($env:FRAMEWORK -eq "bdd") {
              Write-Host "Executing individual BDD feature: $env:TEST_TARGET"

              $feature = $env:TEST_TARGET.Trim()

              if (-not (Test-Path -LiteralPath $feature -PathType Leaf)) {
                throw "BDD feature file not found: $feature"
              }

              if ($feature -notmatch '\.feature$') {
                throw "BDD target must be a .feature file."
              }

              $mavenArgs += "-Dcucumber.features=$feature"
            }
          }

          Write-Host "Running Maven:"
          Write-Host "mvn $($mavenArgs -join ' ')"

          & mvn @mavenArgs 2>&1 | Tee-Object -FilePath "maven-execution.log"

          $testExitCode = $LASTEXITCODE

          if ($testExitCode -ne 0) {
            Write-Error "Automation tests failed. Maven exit code: $testExitCode"
            exit $testExitCode
          }

          Write-Host "Automation execution completed successfully."

      - name: Upload TestNG Execution Dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-execution-dashboard
          path: test-output/dashboard/ExecutionDashboard.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload TestNG Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-reports
          path: |
            test-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Cucumber BDD Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports
          path: |
            target/cucumber-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Maven Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-execution-logs
          path: |
            maven-execution.log
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Execution Summary
        if: always()
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "SELENIUM AUTOMATION EXECUTION SUMMARY"
          Write-Host "======================================"
          Write-Host "Framework: $env:FRAMEWORK"
          Write-Host "Execution Mode: $env:EXECUTION_MODE"
          Write-Host "Browser: $env:BROWSER"
          Write-Host "Headless: $env:HEADLESS"
          Write-Host "Maven Profile: $env:PROFILE"
          Write-Host "Test Target: $env:TEST_TARGET"
          Write-Host "======================================"
